name: Build EMB03 Linux Kernel

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (e.g. Image, modules, Image modules)'
        required: true
        default: 'Image modules'
        type: string
      upload_artifacts:
        description: 'Upload build artifacts'
        required: true
        default: true
        type: boolean
      keep_going:
        description: 'Diagnostic: make -k, keep building after errors to list every failure (the run still fails)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Kernel (5.10.72-emb03)
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-
      # NXP 2.6.0 common/build/kernel.mk: KERNEL_CFLAGS := -Wno-incompatible-pointer-types whenever clang builds
      KCFLAGS: -Wno-incompatible-pointer-types
      LOCALVERSION: ""
      KBUILD_BUILD_USER: Factory48
      KBUILD_BUILD_HOST: factory48-ci
      # KBUILD_BUILD_TIMESTAMP is set by the "Set Kernel Build Timestamp" step below (year pinned to 2021)
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,file_macro
      # NXP android-11.0.0_2.6.0 builds 5.10.72 with clang r416183b (device/nxp common/build/kernel.mk); clang 11
      # (r383902b) cannot assemble the KVM nVHE hyp-reloc.S that 5.10.72 generates.
      CLANG_VERSION: r416183b
      CLANG_URL: https://codeload.github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/tar.gz/54220fd601050b350b2af7adc913089ebf0e7aed
      CLANG_TAR_SHA256: 353321c04acf608b605599373eaa26cf1359385717d1b69316b48ba2df09e47e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex libelf-dev libssl-dev \
            libncurses-dev kmod python3 xz-utils curl tar

      - name: Cache Clang Toolchain (r416183b)
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: toolchain-clang-r416183b-54220fd6-v1

      - name: Download & Extract Clang Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/tmp
          echo "Downloading Android Clang toolchain r416183b..."
          curl -L -s --retry 3 "${{ env.CLANG_URL }}" -o toolchains/tmp/clang-r416183b.tar.gz
          echo "${{ env.CLANG_TAR_SHA256 }}  toolchains/tmp/clang-r416183b.tar.gz" | sha256sum -c -
          mkdir -p "${{ env.TOOLCHAIN_DIR }}"
          tar -xzf toolchains/tmp/clang-r416183b.tar.gz -C "${{ env.TOOLCHAIN_DIR }}" --strip-components=1
          rm -rf toolchains/tmp
          echo "Toolchain extracted successfully."

      - name: Verify Toolchain
        run: |
          "${{ env.TOOLCHAIN_DIR }}/bin/clang" --version
          "${{ env.TOOLCHAIN_DIR }}/bin/ld.lld" --version

      - name: Setup Ccache Environment
        run: |
          mkdir -p "$CCACHE_DIR"
          mkdir -p "${{ github.workspace }}/.ccache-bin"
          ln -sf /usr/bin/ccache "${{ github.workspace }}/.ccache-bin/clang"
          ln -sf /usr/bin/ccache "${{ github.workspace }}/.ccache-bin/clang++"
          ln -sf /usr/bin/ccache "${{ github.workspace }}/.ccache-bin/gcc"
          ln -sf /usr/bin/ccache "${{ github.workspace }}/.ccache-bin/g++"
          ccache --set-config=max_size=2.5G
          ccache --set-config=compression=true
          # GitHub prepends GITHUB_PATH entries in reverse order: write the toolchain first so the ccache
          # wrappers end up ahead of it (before this, ccache was never invoked: 0 hits / 0 misses).
          echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/.ccache-bin" >> $GITHUB_PATH
          # NXP 2.6.0 kernel.mk builds with CCACHE_NODIRECT=true
          echo "CCACHE_NODIRECT=true" >> $GITHUB_ENV

      - name: Restore Ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-kernel-${{ env.CLANG_VERSION }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-kernel-${{ env.CLANG_VERSION }}-${{ github.ref_name }}-
            ccache-kernel-${{ env.CLANG_VERSION }}-

      - name: Zero Ccache Statistics
        run: |
          ccache -z

      - name: Set Kernel Build Timestamp (year 2021)
        run: |
          # Same `date` format the kernel would use on its own (C locale); only the year is pinned. Month/day/time
          # stay current and the weekday comes from the 2021 calendar, so the string is self-consistent.
          # Feb 29 does not exist in 2021: use Feb 28 on that one day instead of failing the build.
          MD="$(date -u +%m-%d)"
          [ "$MD" = "02-29" ] && MD="02-28"
          TS="$(LC_ALL=C date -u -d "2021-$MD $(date -u +%H:%M:%S)")"
          case "$TS" in *" 2021") ;; *) echo "bad timestamp: $TS" >&2; exit 1 ;; esac
          echo "KBUILD_BUILD_TIMESTAMP=$TS" >> "$GITHUB_ENV"
          echo "Kernel build timestamp: $TS"

      - name: Configure Kernel
        run: |
          mkdir -p build/out
          touch .scmversion
          if [ -f arch/arm64/configs/emb03_factory48_defconfig ]; then
            make -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/build/out" \
              ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
              emb03_factory48_defconfig
          else
            echo "ERROR: emb03_factory48_defconfig not found!" >&2
            exit 1
          fi
          # The defconfig is a full resolved config: fail if Kconfig would silently change any symbol.
          diff <(grep -E '^(CONFIG_|# CONFIG_)' arch/arm64/configs/emb03_factory48_defconfig | sort) \
               <(grep -E '^(CONFIG_|# CONFIG_)' build/out/.config | sort) > build/defconfig-drift.txt || {
            echo "ERROR: emb03_factory48_defconfig is not a fixed point of Kconfig:" >&2
            cat build/defconfig-drift.txt >&2
            exit 1
          }
          # Verify extra firmware path is present
          if [ ! -f "imx/sdma/sdma-imx7d.bin" ]; then
            echo "ERROR: imx/sdma/sdma-imx7d.bin firmware missing!" >&2
            exit 1
          fi

      - name: Build Kernel Image & Modules
        run: |
          NPROC=$(nproc)
          TARGETS="${{ github.event.inputs.build_target || 'Image modules' }}"
          KEEP=""
          [ "${{ github.event.inputs.keep_going }}" = "true" ] && KEEP="-k"
          echo "Building targets: $TARGETS with $NPROC parallel jobs ${KEEP}..."
          set -o pipefail
          make -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/build/out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="$KCFLAGS" \
            -j"$NPROC" $KEEP $TARGETS 2>&1 | tee build/build.log

      - name: Error Summary
        if: failure()
        run: |
          echo "== compiler errors"; grep -E ": (fatal )?error:" build/build.log | sort -u || true
          echo "== failed make targets"; grep -E "\*\*\* \[.*\] Error" build/build.log | sed -E 's/.*\[([^]]+)\].*/\1/' | sort -u || true

      - name: Display Ccache Statistics
        run: |
          ccache -s

      - name: Package Kernel & Modules Artifacts
        run: |
          mkdir -p dist
          # Copy Image and core artifacts
          cp build/out/arch/arm64/boot/Image dist/Image
          cp build/out/System.map dist/System.map
          cp build/out/Module.symvers dist/Module.symvers
          cp build/out/.config dist/kernel.config
          
          # Install and package modules
          mkdir -p dist/modules
          make -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/build/out" \
            ARCH=arm64 INSTALL_MOD_PATH="$GITHUB_WORKSPACE/dist/modules" \
            modules_install
          
          cd dist
          tar -czf modules.tar.gz -C modules .
          rm -rf modules
          
          # Compute SHA256 checksums
          sha256sum Image modules.tar.gz System.map Module.symvers kernel.config > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-5.10.72-emb03
          path: dist/
          retention-days: 14

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Image
            dist/modules.tar.gz
            dist/kernel.config
            dist/Module.symvers
            dist/System.map
            dist/SHA256SUMS.txt
          generate_release_notes: true
